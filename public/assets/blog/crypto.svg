<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="blogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff00ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00fff0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0f1c"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00fff0" stroke-width="0.5" opacity="0.2"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Border -->
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="url(#blogGrad)" stroke-width="3" stroke-dasharray="15,5"/>

  <!-- Icon -->
  <g transform="translate(500, 220)">
    <circle cx="100" cy="0" r="60" fill="none" stroke="url(#blogGrad)" stroke-width="3"/>
    <rect x="70" y="30" width="60" height="8" fill="url(#blogGrad)" opacity="0.5" rx="4"/>
    <rect x="70" y="48" width="40" height="8" fill="url(#blogGrad)" opacity="0.3" rx="4"/>
  </g>

  <!-- Title -->
  <text x="600" y="400" font-family="Orbitron, sans-serif" font-size="48" font-weight="bold" fill="url(#blogGrad)" text-anchor="middle">
    BLOG POST IMAGE
  </text>
  <text x="600" y="450" font-family="Rajdhani, sans-serif" font-size="24" fill="#e0e0e0" text-anchor="middle" opacity="0.7">
    1200 x 630 - Replace with your blog image
  </text>

  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="20" fill="none" stroke="#00fff0" stroke-width="2" opacity="0.3"/>
  <circle cx="1100" cy="530" r="30" fill="none" stroke="#ff00ff" stroke-width="2" opacity="0.3"/>
</svg>
