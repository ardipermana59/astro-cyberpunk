<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="portGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00fff0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0f1c"/>

  <!-- Digital rain effect -->
  <g opacity="0.1">
    <text x="100" y="50" font-family="monospace" font-size="20" fill="#00fff0">01001000</text>
    <text x="300" y="100" font-family="monospace" font-size="20" fill="#00fff0">11010110</text>
    <text x="500" y="150" font-family="monospace" font-size="20" fill="#00fff0">10101010</text>
    <text x="700" y="200" font-family="monospace" font-size="20" fill="#ff00ff">01110011</text>
    <text x="900" y="250" font-family="monospace" font-size="20" fill="#ff00ff">11001100</text>
    <text x="1100" y="300" font-family="monospace" font-size="20" fill="#00fff0">10011001</text>
  </g>

  <!-- Border -->
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="url(#portGrad)" stroke-width="3" stroke-dasharray="15,5"/>

  <!-- Code brackets -->
  <g transform="translate(450, 250)">
    <text x="0" y="0" font-family="Orbitron, sans-serif" font-size="120" font-weight="bold" fill="url(#portGrad)">
      &lt;/&gt;
    </text>
  </g>

  <!-- Title -->
  <text x="600" y="420" font-family="Orbitron, sans-serif" font-size="48" font-weight="bold" fill="url(#portGrad)" text-anchor="middle">
    PORTFOLIO PROJECT
  </text>
  <text x="600" y="470" font-family="Rajdhani, sans-serif" font-size="24" fill="#e0e0e0" text-anchor="middle" opacity="0.7">
    1200 x 630 - Replace with your project image
  </text>

  <!-- Corner decorations -->
  <path d="M 50 50 L 50 80 M 50 50 L 80 50" stroke="#00fff0" stroke-width="3" opacity="0.5"/>
  <path d="M 1150 50 L 1150 80 M 1150 50 L 1120 50" stroke="#ff00ff" stroke-width="3" opacity="0.5"/>
  <path d="M 50 580 L 50 550 M 50 580 L 80 580" stroke="#ff00ff" stroke-width="3" opacity="0.5"/>
  <path d="M 1150 580 L 1150 550 M 1150 580 L 1120 580" stroke="#00fff0" stroke-width="3" opacity="0.5"/>
</svg>
