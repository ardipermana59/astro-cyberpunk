<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00fff0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="#0a0f1c"/>

  <!-- Hologram frame -->
  <rect x="20" y="20" width="460" height="460" fill="none" stroke="url(#avatarGrad)" stroke-width="4" stroke-dasharray="10,5" opacity="0.5"/>

  <!-- Avatar circle -->
  <circle cx="250" cy="220" r="80" fill="none" stroke="url(#avatarGrad)" stroke-width="3"/>
  <circle cx="250" cy="210" r="40" fill="url(#avatarGrad)" opacity="0.3"/>

  <!-- Body -->
  <path d="M 180 340 Q 250 300 320 340" fill="none" stroke="url(#avatarGrad)" stroke-width="3"/>
  <path d="M 170 340 L 170 400 M 330 340 L 330 400" stroke="url(#avatarGrad)" stroke-width="3"/>

  <!-- Scan lines -->
  <line x1="50" y1="150" x2="450" y2="150" stroke="#00fff0" stroke-width="1" opacity="0.3"/>
  <line x1="50" y1="250" x2="450" y2="250" stroke="#ff00ff" stroke-width="1" opacity="0.3"/>
  <line x1="50" y1="350" x2="450" y2="350" stroke="#00fff0" stroke-width="1" opacity="0.3"/>

  <!-- Text -->
  <text x="250" y="450" font-family="Orbitron, sans-serif" font-size="24" font-weight="bold" fill="url(#avatarGrad)" text-anchor="middle">
    YOUR PHOTO HERE
  </text>
  <text x="250" y="475" font-family="Rajdhani, sans-serif" font-size="14" fill="#e0e0e0" text-anchor="middle" opacity="0.7">
    Replace with your profile image
  </text>
</svg>
