<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00fff0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" fill="#0a0f1c" rx="32"/>

  <!-- Border -->
  <rect x="12" y="12" width="168" height="168" fill="none" stroke="url(#iconGrad)" stroke-width="3" rx="24"/>

  <!-- Initials -->
  <text x="96" y="125" font-family="Orbitron, sans-serif" font-size="80" font-weight="bold" fill="url(#iconGrad)" text-anchor="middle">
    AP
  </text>

  <!-- Glow effect -->
  <circle cx="96" cy="96" r="60" fill="none" stroke="url(#iconGrad)" stroke-width="2" opacity="0.3"/>
</svg>
